<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <title>Portal Eventos</title>
</head>
<body>
    <header class="p-3 bg-dark text-white d-flex d-flex justify-content-center py-3 justify-content-between">
        <a href="#dashboard" data-view="dashboard">Dashboard</a>
        <a href="#eventos" data-view="eventos">Eventos</a>
        <a href="#novo-evento" data-view="novo-evento">Novo Evento</a>
    </header>

    <main id="app" class="container pb-5">
        <div id="dashboard" class="card-body shadow-sm mb-4">
            <h1 class="mb-2">Dashboard</h1>
            <span id="event-info" class="badge text-black mb-2">Total de eventos:  .  realizados e  agendados</span>
            <div class="row">
                <label for="txtFilter" class="form-label">
                    Pesquisar evento:
                </label>
                <div class="col-sm">
                    <input type="text" id="txtFilter" class="form-control mb-3" placeholder="Nome do evento">
                </div>
                <div class="col-sm">
                    <select id="selectFilter" class="form-select">
                        <option value="">Todos</option>
                        <option value="Realizado">Realizados</option>
                        <option value="N">Não Realizado</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="eventos" class="card-body shadow-sm mb-5 d-none">
            <h1 class="mb-2">Eventos</h1>
            <span id="event-info" class="badge text-black mb-2">Total de eventos:  .  realizados e  agendados</span>
            <div class="row">
                <label for="txtFilterE" class="form-label">
                    Pesquisar evento:
                </label>
                <div class="col-sm">
                    <input type="text" id="txtFilterE" class="form-control mb-3" placeholder="Nome do evento">
                </div>
                <div class="col-sm">
                    <select id="selectFilterE" class="form-select">
                        <option value="">Todos</option>
                        <option value="Realizado">Realizados</option>
                        <option value="N">Não Realizado</option>
                    </select>
                </div>
            </div>  
        </div>
        <div id="novo-evento" class="card-body shadow-sm mb-4 d-none">
            <h1 class="mb-2">Cadastrar novos eventos</h1>
            <span id="subtituloNewEvent" class="badge text-black mb-2">Crie aqui novos eventos</span>
            <form id="eventForm">

                <label for="eventName ">Nome do evento</label>
                <input type="text" class="form-control" id="eventName" placeholder="Nome do evento">

                <label for="eventType ">Tipo de evento</label>
                <select id="eventType" class="form-select">
                    <option value="">Escolha</option>
                    <option value="palestra">Palestra</option>
                    <option value="workshop">Workshop</option>
                    <option value="minicurso">Minicurso</option>
                    <option value="visita-tecnica">Visita Técnica</option>
                </select>

                <label for="eventLocal ">Local</label>
                <input type="text" class="form-control" id="eventLocal" placeholder="Local do evento">

                <label for="eventDate ">Data do evento</label>
                <input type="date" class="form-control" id="eventDate">

                <label for="eventDescription ">Descrição</label>
                <input type="textarea" class="form-control" id="eventDescription" placeholder="Descrição do evento">

                <button id="btnNewEvent" class="btn btn-primary" type="button">Cadastrar evento</button>
            </form>
        </div>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
